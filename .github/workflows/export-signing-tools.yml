name: Export Android APK signing tools

on:
  push:
    branches:
      - kyobo-samsung-tts-fix

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Package apksigner and zipalign
        run: |
          set -euo pipefail
          mkdir -p android-signing-tools
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          cp "$BUILD_TOOLS/apksigner" "$BUILD_TOOLS/zipalign" android-signing-tools/
          cp -a "$BUILD_TOOLS/lib" "$BUILD_TOOLS/lib64" android-signing-tools/
          (cd android-signing-tools && zip -q -r ../android-signing-tools.zip .)
          ls -lh android-signing-tools.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools
          path: android-signing-tools.zip
          retention-days: 7
