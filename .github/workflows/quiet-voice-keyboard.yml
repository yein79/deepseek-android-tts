name: Build Quiet Voice Keyboard APK
on:
  push:
    branches: [quiet-voice-keyboard-apk]
    paths: ['quiet-voice-keyboard/**', '.github/workflows/quiet-voice-keyboard.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo /tmp/gradle-8.9/bin >> $GITHUB_PATH
      - name: Build APK
        run: gradle -p quiet-voice-keyboard :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QuietVoiceKeyboard-debug-apk
          path: quiet-voice-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
