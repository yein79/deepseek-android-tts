name: Build Kyobo Samsung TTS APK

on:
  push:
    branches:
      - kyobo-samsung-tts-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout patch script
        uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK build-tools
        run: sdkmanager "build-tools;35.0.0" "platform-tools"

      - name: Download Kyobo Library 2.2.6 arm64 bundle
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://d.apkpure.net/b/XAPK/kr.co.kyobobook.KEL?nc=arm64-v8a&sv=24&versionCode=48&lang=ko&locale=ko-KR&dpi=xxhdpi&density=xxhdpi' \
            -o source.xapk
          test "$(stat -c%s source.xapk)" -gt 50000000
          mkdir source
          unzip -q source.xapk -d source
          find source -maxdepth 2 -type f -name '*.apk' -printf '%p %s bytes\\n'
          test "$(find source -type f -name '*.apk' | wc -l)" -ge 2
          if [ -f source/base.apk ]; then
            cp source/base.apk base-original.apk
          elif [ -f source/kr.co.kyobobook.KEL.apk ]; then
            cp source/kr.co.kyobobook.KEL.apk base-original.apk
          else
            echo 'Cannot identify base APK in XAPK'
            exit 1
          fi

      - name: Install Apktool
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".jar") and a["name"].startswith("apktool_")))' )"
          curl -fL "$URL" -o apktool.jar
          java -jar apktool.jar --version

      - name: Decode and patch Samsung TTS engine
        run: |
          set -euo pipefail
          java -Xmx5g -jar apktool.jar d -f base-original.apk -o decoded
          python3 tools/patch_kyobo_tts.py decoded
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" ./aapt2
          chmod +x ./aapt2
          set +e
          java -Xmx5g -jar apktool.jar b decoded --aapt "$GITHUB_WORKSPACE/aapt2" -o base-patched-full.apk
          build_rc=$?
          set -e
          if [ "$build_rc" -eq 0 ] && [ -s base-patched-full.apk ]; then
            cp base-patched-full.apk base-patched-unsigned.apk
          else
            echo "Resource repack failed; retaining original resources and transplanting the assembled classes4.dex."
            test -s decoded/build/apk/classes4.dex
            python3 tools/replace_dex.py base-original.apk decoded/build/apk/classes4.dex base-patched-unsigned.apk
          fi
          test -s base-patched-unsigned.apk

      - name: Sign base and matching split APKs
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore build.jks -storepass changeit -keypass changeit \
            -alias kyobo-tts-fix -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Personal Kyobo TTS Fix, OU=Local, O=Local, L=Seoul, ST=Seoul, C=KR'
          mkdir -p output
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 base-patched-unsigned.apk output/base.apk
          "$BUILD_TOOLS/apksigner" sign --ks build.jks --ks-key-alias kyobo-tts-fix \
            --ks-pass pass:changeit --key-pass pass:changeit --out output/base.apk.signed output/base.apk
          mv output/base.apk.signed output/base.apk
          for f in source/*.apk; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              base.apk|kr.co.kyobobook.KEL.apk) continue ;;
            esac
            "$BUILD_TOOLS/zipalign" -f -p 4 "$f" "output/$name.aligned"
            "$BUILD_TOOLS/apksigner" sign --ks build.jks --ks-key-alias kyobo-tts-fix \
              --ks-pass pass:changeit --key-pass pass:changeit --out "output/$name" "output/$name.aligned"
            rm "output/$name.aligned"
          done
          "$BUILD_TOOLS/apksigner" verify --verbose output/base.apk
          for f in output/*.apk; do "$BUILD_TOOLS/apksigner" verify "$f"; done
          (cd output && zip -q -r ../Kyobo-2.2.6-Samsung-TTS-Fix.zip .)
          sha256sum Kyobo-2.2.6-Samsung-TTS-Fix.zip

      - name: Try merging split APKs into a single APK
        continue-on-error: true
        run: |
          set -u
          mkdir -p merge-tool
          release="$(curl -fsSL https://api.github.com/repos/REAndroid/APKEditor/releases/latest)"
          url="$(printf '%s' "$release" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((a["browser_download_url"] for a in d.get("assets",[]) if a["name"].lower().endswith(".jar")), ""))')"
          if [ -z "$url" ]; then
            echo "APKEditor JAR not found; leaving split bundle available."
            exit 0
          fi
          curl -fL "$url" -o merge-tool/APKEditor.jar
          java -Xmx5g -jar merge-tool/APKEditor.jar merge -i output -o Kyobo-2.2.6-Samsung-TTS-Single-unsigned.apk
          test -s Kyobo-2.2.6-Samsung-TTS-Single-unsigned.apk

          # The official app's signing key is unavailable, so package this as a
          # separate app instead of an update. This preserves the installed original.
          java -Xmx5g -jar apktool.jar d -f Kyobo-2.2.6-Samsung-TTS-Single-unsigned.apk -o separate-decoded
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("separate-decoded/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          old = "kr.co.kyobobook.KEL"
          new = "kr.co.kyobobook.KEL.samsungtts"
          if not re.search(r'package="' + re.escape(old) + r'"', s):
              raise SystemExit("Expected original package id not found in merged manifest")
          s = s.replace(old, new)
          s, n = re.subn(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              r'\1교보도서관 삼성TTS\2', s, count=1, flags=re.S
          )
          p.write_text(s, encoding="utf-8")
          if f'package="{new}"' not in s:
              raise SystemExit("Separate package id was not applied")
          print("Created side-by-side package:", new, "label changed:", bool(n))
          PY
          java -Xmx5g -jar apktool.jar b separate-decoded --aapt "$GITHUB_WORKSPACE/aapt2" -o Kyobo-2.2.6-Samsung-TTS-Separate-unsigned.apk
          test -s Kyobo-2.2.6-Samsung-TTS-Separate-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks build.jks --ks-key-alias kyobo-tts-fix \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --out Kyobo-2.2.6-Samsung-TTS-Separate.apk Kyobo-2.2.6-Samsung-TTS-Separate-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Kyobo-2.2.6-Samsung-TTS-Separate.apk
          ls -lh Kyobo-2.2.6-Samsung-TTS-Separate.apk

      - name: Upload single APK if merge succeeded
        uses: actions/upload-artifact@v4
        with:
          name: Kyobo-2.2.6-Samsung-TTS-Separate
          path: Kyobo-2.2.6-Samsung-TTS-Separate.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload installable split APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kyobo-2.2.6-Samsung-TTS-Fix
          path: Kyobo-2.2.6-Samsung-TTS-Fix.zip
          if-no-files-found: error
          retention-days: 30
